# ============================================================
# Nginx 安全加固配置（卫星守望者）
# 部署位置：/etc/nginx/sites-available/satellite-watcher
# 用法：sudo cp nginx-secure.conf /etc/nginx/sites-available/satellite-watcher
#       sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# ---- 限流区域定义（http 块级别，需放到 nginx.conf http {} 内） ----
# 以下 limit_req_zone 建议放到 /etc/nginx/nginx.conf 的 http {} 块中
# limit_req_zone $binary_remote_addr zone=static:10m rate=30r/s;
# limit_req_zone $binary_remote_addr zone=api_read:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=api_import:10m rate=2r/s;
# limit_req_zone $binary_remote_addr zone=api_sensitive:10m rate=5r/m;
# limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
# limit_conn_zone $server_name zone=conn_total:10m;

server {
    listen 80;
    server_name www.wanzhixuexi.cn wanzhixuexi.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.wanzhixuexi.cn wanzhixuexi.cn;

    # SSL 配置
    ssl_certificate     /etc/letsencrypt/live/www.wanzhixuexi.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.wanzhixuexi.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- 隐藏 Nginx 版本 ----
    server_tokens off;

    # ---- 并发连接限制（每IP最多10个，全局最多100个）----
    limit_conn conn_per_ip 10;
    limit_conn conn_total 100;

    # ---- 请求体大小限制（防止大文件上传攻击）----
    client_max_body_size 3m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;

    # ---- 安全响应头 ----
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://assets.cesium.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self' blob:; model-src 'self' data: blob:; media-src 'self';" always;

    # ---- 静态资源（_next/static，Next.js 缓存）----
    location /_next/static/ {
        limit_req zone=static burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- 3D模型文件 ----
    location /models/ {
        limit_req zone=static burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- Cesium 静态资源 ----
    location /cesium/ {
        limit_req zone=static burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- 音频文件 ----
    location /audio/ {
        limit_req zone=static burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- TLE 导入/搜索 API（会调用外部 Celestrak/NASA）----
    location /api/tle/import/ {
        limit_req zone=api_import burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # ---- NASA 图片搜索/代理 API ----
    location /api/nasa- {
        limit_req zone=api_import burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
    }

    # ---- TLE 刷新 + 管理员操作（需要密码）----
    location /api/tle/refresh {
        limit_req zone=api_sensitive burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /api/admin/ {
        limit_req zone=api_sensitive burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 3m;
        proxy_read_timeout 30s;
    }

    # ---- 普通 API ----
    location /api/ {
        limit_req zone=api_read burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
    }

    # ---- 页面（SSR）----
    location / {
        limit_req zone=api_read burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # ---- 禁止访问隐藏文件 ----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ---- 自定义错误页面 ----
    error_page 429 @too_many_requests;
    location @too_many_requests {
        default_type application/json;
        return 429 '{"success":false,"error":"请求过于频繁，请稍后再试"}';
    }

    error_page 503 @busy;
    location @busy {
        default_type application/json;
        return 503 '{"success":false,"error":"服务器繁忙，请稍后再试"}';
    }
}
